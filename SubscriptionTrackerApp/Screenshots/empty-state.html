<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .iphone {
            width: 390px;
            height: 844px;
            background: white;
            border-radius: 40px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        .status-bar {
            height: 44px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
        }
        .nav-bar {
            height: 50px;
            background: white;
            border-bottom: 0.5px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }
        .nav-title {
            font-size: 34px;
            font-weight: bold;
            padding: 10px 16px;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 500px;
            padding: 40px;
            text-align: center;
        }
        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .empty-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .empty-message {
            font-size: 15px;
            color: #666;
            line-height: 1.4;
        }
        .plus-button {
            width: 28px;
            height: 28px;
            border-radius: 14px;
            background: #007AFF;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="iphone">
        <div class="status-bar">
            <span>9:41</span>
            <div style="display: flex; gap: 5px;">
                <span>📶</span>
                <span>📡</span>
                <span>🔋</span>
            </div>
        </div>
        <div class="nav-bar">
            <div></div>
            <div></div>
            <div class="plus-button">+</div>
        </div>
        <div class="nav-title">Subscriptions</div>
        
        <div class="empty-state">
            <div class="empty-icon">💳</div>
            <div class="empty-title">No subscriptions yet</div>
            <div class="empty-message">Tap the + button to add your first subscription</div>
        </div>
    </div>
</body>
</html>
